<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo: Componente de Imagen con Lupa Interactiva (Zoom on Hover)</title>
    <link rel="stylesheet" href="css/product-zoom.css">
    <style>
        body {
            background-color: #07090e;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
        }

        .demo-container {
            max-width: 600px;
            width: 100%;
        }

        .demo-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .demo-header h1 {
            font-size: 24px;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .demo-header p {
            font-size: 14px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="demo-container">
        <div class="demo-header">
            <h1>Componente de Producto con Lupa Interactiva</h1>
            <p>Haz clic en el botón <strong>"Lupa"</strong> para activar el modo de acercamiento.</p>
        </div>

        <!-- COMPONENTE: PRODUCT GALLERY ZOOM (ESTILO REDONDEADO TIPO INDEX) -->
        <div id="product-zoom-frame" class="product-zoom-frame">
            <!-- Botón Lupa Toggle (Solo ícono grande, sin texto ni brillo) -->
            <button type="button" 
                    id="btn-toggle-zoom" 
                    class="product-zoom-btn" 
                    title="Activar lupa de acercamiento"
                    aria-pressed="false"
                    aria-label="Activar lupa de acercamiento">
                <svg class="zoom-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    <line x1="11" y1="8" x2="11" y2="14"></line>
                    <line x1="8" y1="11" x2="14" y2="11"></line>
                </svg>
            </button>

            <!-- Imagen del Producto con Acabado Redondeado tipo index -->
            <img id="product-zoom-img" 
                 src="https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=1000&auto=format&fit=crop&q=80" 
                 alt="Teclado Gamer Mecánico" 
                 class="product-zoom-img" 
                 draggable="false">
        </div>
    </div>

    <!-- Script del Componente -->
    <script src="js/product-zoom.js"></script>
    <script>
        // Inicialización en Vanilla JS
        document.addEventListener('DOMContentLoaded', () => {
            new ProductZoom({
                frame: '#product-zoom-frame',
                img: '#product-zoom-img',
                btn: '#btn-toggle-zoom',
                badge: '#zoom-status-badge',
                zoomLevel: 1.32 // Nivel de magnificación moderado y sutil
            });
        });
    </script>
</body>
</html>
